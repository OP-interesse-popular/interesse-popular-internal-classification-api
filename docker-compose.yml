services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opip_internal_classification
      POSTGRES_USER: opip
      POSTGRES_PASSWORD: opip
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
